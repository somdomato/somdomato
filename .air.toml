root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["templ generate"]
  cmd = "go build -o ./tmp/server ./api/cmd/server"
  bin = "./tmp/server"
  include_ext = ["go", "templ", "sql", "css", "js"]
  exclude_dir = ["tmp", "node_modules", ".git"]
  exclude_regex = ["_templ.go"]
  delay = 200

[log]
  time = true

[proxy]
  # air roda nativo no host (não em container) via `make air`/`make dev` —
  # o navegador acessa a app por aqui (:3000, com livereload injetado); a
  # app de verdade escuta em app_port (HTTP_ADDR=127.0.0.1:3001, ver
  # scripts/dev-env.sh).
  enabled = true
  proxy_port = 3000
  app_port = 3001
