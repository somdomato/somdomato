name: Deploy

# A cada push em main: roda testes (com Postgres real) e, se passarem,
# builda o binário (linux/amd64, estático) + CSS/templates via `make build`
# (mesmo alvo usado localmente e em scripts/deploy.sh) e publica na VPS via
# appleboy/scp-action + appleboy/ssh-action (usuário/senha dos secrets).

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEMPL_VERSION: v0.3.1020

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdm
          POSTGRES_PASSWORD: sdm_ci
          POSTGRES_DB: sdm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Instalar templ
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: make vet
        run: make vet

      - name: make test
        env:
          DATABASE_URL: postgres://sdm:sdm_ci@localhost:5432/sdm?sslmode=disable
        run: make test

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Instalar templ
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Instalar Tailwind CLI standalone
        run: |
          curl -sSL -o tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64"
          chmod +x tailwindcss

      - name: make build
        run: make build

      - name: Enviar binário e deploy.sh para a VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT }}
          source: "tmp/somdomato-server,scripts/deploy.sh"
          target: ${{ secrets.PROJECT_PATH }}/bin
          strip_components: 1

      - name: Rodar deploy.sh na VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT }}
          envs: PROJECT_PATH
          script: |
            chmod +x $PROJECT_PATH/bin/deploy.sh
            APP_DIR=$PROJECT_PATH $PROJECT_PATH/bin/deploy.sh
        env:
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
