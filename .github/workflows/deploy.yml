name: Deploy

# A cada push em main: roda testes (com Postgres real) e, se passarem,
# builda o binário (linux/amd64, estático) + CSS/templates aqui no runner e
# publica na VPS via appleboy/scp-action + appleboy/ssh-action (usuário/senha
# dos secrets). scripts/deploy.sh faz o equivalente para deploy manual.

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEMPL_VERSION: v0.3.1020

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdm
          POSTGRES_PASSWORD: sdm_ci
          POSTGRES_DB: sdm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Instalar templ
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Gerar templates
        run: templ generate

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          DATABASE_URL: postgres://sdm:sdm_ci@localhost:5432/sdm?sslmode=disable
        run: go test ./...

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Instalar templ
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Instalar Tailwind CLI standalone
        run: |
          curl -sSL -o tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64"
          chmod +x tailwindcss
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Gerar templates e CSS
        run: |
          templ generate
          ./tailwindcss --input web/css/input.css --output web/static/css/output.css --minify

      - name: Compilar binário linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w" \
            -o tmp/somdomato-server \
            ./api/cmd/server

      - name: Enviar binário e deploy-remote.sh para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT }}
          source: "tmp/somdomato-server,scripts/deploy-remote.sh"
          target: ${{ secrets.PROJECT_PATH }}/bin
          strip_components: 1

      - name: Rodar deploy-remote.sh na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT }}
          envs: PROJECT_PATH
          script: |
            chmod +x $PROJECT_PATH/bin/deploy-remote.sh
            APP_DIR=$PROJECT_PATH $PROJECT_PATH/bin/deploy-remote.sh
        env:
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
