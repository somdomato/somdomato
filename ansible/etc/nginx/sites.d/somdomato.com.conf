server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;
   
    ssl_certificate         /etc/letsencrypt/live/somdomato.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/somdomato.com/privkey.pem;

    server_name somdomato.com www.somdomato.com;

    location /facebook { return 301 https://facebook.com/somdomato; }
    location /instagram { return 301 https://instagram.com/somdomato; }
    location /x { return 301 https://x.com/radiosomdomato; }
    location /reddit { return 301 https://reddit.com/r/radiosomdomato; }
    location /whatsapp { return 301 https://wa.me/somdomato; }
    location /telegram { return 301 https://t.me/somdomato; }

    include conf.d/sdm-errors.conf;

    # Não se esqueça de include /etc/nginx/conf.d/geoip.conf; no bloco http do nginx.conf para habilitar as variáveis geoip2
    location /geoip {
        default_type application/json;

        return 200 '{
            "ip": "$remote_addr",
            "country_code": "$geoip2_country_code",
            "country": "$geoip2_country_name",
            "region_code": "$geoip2_region_code",
            "region": "$geoip2_region_name",
            "city": "$geoip2_city_name",
            "postal_code": "$geoip2_postal_code",
            "latitude": "$geoip2_latitude",
            "longitude": "$geoip2_longitude",
            "timezone": "$geoip2_timezone"
        }';
    }

    # Bloqueia acesso externo às rotas internas do Liquidsoap
    location /api/music {
        deny all;
        return 403;
    }

    # Serve static assets directly with Nginx
    location /_next/static {
        # Adjust the alias path to your project's .next/static directory
        alias /var/www/somdomato/.next/static;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    location / {
        # Reverse proxy for the Next.js server
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}