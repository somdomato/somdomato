---
# Ansible Playbook - Som do Mato
# Provisiona uma VPS Debian 13 com Nginx, PostgreSQL, Icecast2, Liquidsoap e
# o binário Go (via systemd). Não usa Podman em produção — só em dev
# (ver Makefile / podman/compose.yml).
#
# Toda a config (segredos e topologia) vem de um único arquivo na raiz do
# repo: ../.env.production (criptografado com `ansible-vault`). Veja
# .env.production.example. Nada de segredo fica hardcoded aqui.
#
# Uso:
#   ansible-playbook -i inventory.ini playbook.yml --ask-vault-pass

- name: Provisionar VPS Som do Mato
  hosts: production
  become: true
  vars:
    radio_genres:
      - { mountpoint: geral, label: "Geral" }
      - { mountpoint: gaucha, label: "Gaúcha" }
      - { mountpoint: modao, label: "Modão" }
      - { mountpoint: arrocha, label: "Arrocha" }
      - { mountpoint: romantico, label: "Romântico" }

  tasks:
    # =========================================================================
    # CONFIG — única fonte de verdade: ../.env.production
    # =========================================================================
    - name: Carregar ../.env.production como dict
      ansible.builtin.set_fact:
        app_env: "{{ app_env | default({}) | combine({ item.split('=', 1)[0]: item.split('=', 1)[1] }) }}"
      loop: "{{ lookup('ansible.builtin.file', playbook_dir + '/../.env.production').splitlines() | select('match', '^[A-Za-z_][A-Za-z0-9_]*=') | list }}"
      loop_control:
        label: "{{ item.split('=')[0] }}"
      no_log: true
      tags: [always]

    - name: Expor variáveis nomeadas a partir de app_env
      ansible.builtin.set_fact:
        domain: "{{ app_env.DOMAIN }}"
        app_dir: "{{ app_env.APP_DIR }}"
        music_dir: "{{ app_env.MUSIC_DIR }}"
        app_user: "{{ app_env.APP_USER }}"
        app_group: "{{ app_env.APP_GROUP }}"
        deploy_user: "{{ app_env.DEPLOY_USER }}"
        ssh_port: "{{ app_env.SSH_PORT }}"
        api_http_port: "{{ app_env.API_HTTP_PORT }}"
        postgres_db: "{{ app_env.POSTGRES_DB }}"
        postgres_user: "{{ app_env.POSTGRES_USER }}"
        postgres_password: "{{ app_env.POSTGRES_PASSWORD }}"
        jwt_secret: "{{ app_env.JWT_SECRET }}"
        radio_internal_token: "{{ app_env.RADIO_INTERNAL_TOKEN }}"
        letsencrypt_email: "{{ app_env.LETSENCRYPT_EMAIL }}"
        icecast_admin_email: "{{ app_env.ICECAST_ADMIN_EMAIL }}"
        icecast_source_password: "{{ app_env.ICECAST_SOURCE_PASSWORD }}"
        icecast_relay_password: "{{ app_env.ICECAST_RELAY_PASSWORD }}"
        icecast_admin_password: "{{ app_env.ICECAST_ADMIN_PASSWORD }}"
        harbor_password: "{{ app_env.HARBOR_PASSWORD }}"
      no_log: true
      tags: [always]

    # =========================================================================
    # SISTEMA BASE
    # =========================================================================
    - name: Atualizar pacotes do sistema
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
      tags: [base]

    - name: Instalar dependências base
      ansible.builtin.apt:
        name: [curl, ca-certificates, gnupg, git, rsync, jq, openssl, acl, ufw]
        state: present
      tags: [base]

    # =========================================================================
    # FIREWALL — só HTTP(S) e o mount público do Icecast ficam expostos.
    # A API Go e o Postgres nunca são acessados de fora (bind em 127.0.0.1).
    # =========================================================================
    - name: Configurar UFW (negar tudo por padrão, exceto SSH/HTTP/HTTPS/Icecast)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ ssh_port }}"
        - "80"
        - "443"
        - "8000"
      tags: [firewall]

    - name: Definir política padrão do UFW (deny incoming)
      community.general.ufw:
        policy: deny
        direction: incoming
      tags: [firewall]

    - name: Habilitar UFW
      community.general.ufw:
        state: enabled
      tags: [firewall]

    # =========================================================================
    # USUÁRIO E DIRETÓRIOS DA APLICAÇÃO
    # =========================================================================
    - name: Criar usuário da aplicação
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        create_home: true
        shell: /bin/bash
      tags: [app]

    - name: Criar diretórios da aplicação
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/bin"
        - "{{ app_dir }}/tmp"
        - "{{ music_dir }}"
        - "{{ music_dir }}/uploads"
        - "{{ music_dir }}/vinhetas"
        - "{{ music_dir }}/covers"
      tags: [app]

    - name: Gerar .env da aplicação a partir de ../.env.production
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0600"
        # Só os campos abaixo são derivados (URL/porta montadas a partir do
        # resto) — tudo mais é passthrough direto de ../.env.production.
        content: |
          APP_ENV=production
          HTTP_ADDR=127.0.0.1:{{ api_http_port }}
          DATABASE_URL=postgres://{{ postgres_user }}:{{ postgres_password }}@127.0.0.1:5432/{{ postgres_db }}?sslmode=disable
          MUSIC_PATH={{ music_dir }}
          COVERS_DIR={{ music_dir }}/covers
          JINGLES_DIR={{ music_dir }}/vinhetas
          JWT_SECRET={{ jwt_secret }}
          RADIO_INTERNAL_TOKEN={{ radio_internal_token }}
          ICECAST_STATUS_URL=http://127.0.0.1:8000/status-json.xsl
          STREAM_BASE_URL=https://radio.{{ domain }}
      no_log: true
      notify: Restart API Go
      tags: [app]

    # =========================================================================
    # POSTGRESQL (nativo — sem container)
    # =========================================================================
    - name: Instalar PostgreSQL
      ansible.builtin.apt:
        name: [postgresql, postgresql-contrib, python3-psycopg2]
        state: present
      tags: [postgres]

    - name: Garantir que o PostgreSQL está rodando
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true
      tags: [postgres]

    - name: Criar role da aplicação no Postgres
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ postgres_user }}"
        password: "{{ postgres_password }}"
        state: present
      tags: [postgres]

    - name: Criar banco da aplicação
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ postgres_db }}"
        owner: "{{ postgres_user }}"
        state: present
      tags: [postgres]

    # =========================================================================
    # NGINX
    # =========================================================================
    - name: Instalar Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
      tags: [nginx]

    - name: Copiar configuração Nginx - somdomato.com
      ansible.builtin.template:
        src: etc/nginx/sites.d/03-somdomato.com.conf.j2
        dest: /etc/nginx/sites-available/03-somdomato.com.conf
        mode: "0644"
      notify: Reload Nginx
      tags: [nginx]

    - name: Copiar configuração Nginx - radio.somdomato.com
      ansible.builtin.template:
        src: etc/nginx/sites.d/02-radio.somdomato.com.conf.j2
        dest: /etc/nginx/sites-available/02-radio.somdomato.com.conf
        mode: "0644"
      notify: Reload Nginx
      tags: [nginx]

    - name: Habilitar sites Nginx (symlinks)
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ item }}"
        dest: "/etc/nginx/sites-enabled/{{ item }}"
        state: link
      loop: [03-somdomato.com.conf, 02-radio.somdomato.com.conf]
      notify: Reload Nginx
      tags: [nginx]

    - name: Remover site default do Nginx
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx
      tags: [nginx]

    # =========================================================================
    # ICECAST2 (nativo)
    # =========================================================================
    - name: Instalar Icecast2
      ansible.builtin.apt:
        name: icecast2
        state: present
      tags: [icecast]

    - name: Criar diretório de logs Icecast
      ansible.builtin.file:
        path: /var/log/icecast2
        state: directory
        owner: icecast2
        group: icecast
        mode: "0755"
      tags: [icecast]

    - name: Gerar configuração Icecast2 a partir do vault
      ansible.builtin.template:
        src: etc/icecast/somdomato.xml.j2
        dest: /etc/icecast2/somdomato.xml
        owner: icecast2
        group: icecast
        mode: "0640"
      notify: Restart Icecast
      tags: [icecast]

    # =========================================================================
    # LIQUIDSOAP (nativo)
    # =========================================================================
    - name: Instalar Liquidsoap
      ansible.builtin.apt:
        name: liquidsoap
        state: present
      tags: [liquidsoap]

    - name: Criar diretórios Liquidsoap
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: liquidsoap
        group: liquidsoap
        mode: "0755"
      loop: [/var/log/liquidsoap, /var/lib/liquidsoap]
      tags: [liquidsoap]

    - name: Gerar script Liquidsoap a partir do vault
      ansible.builtin.template:
        src: etc/liquidsoap/somdomato.liq.j2
        dest: /etc/liquidsoap/somdomato.liq
        owner: liquidsoap
        group: liquidsoap
        mode: "0644"
      notify: Restart Liquidsoap
      tags: [liquidsoap]

    # =========================================================================
    # SYSTEMD — API Go, Icecast, Liquidsoap
    # =========================================================================
    # Units legadas (pré-Ansible, nomes antigos) apontavam para os mesmos
    # arquivos de config e ficavam disputando as mesmas portas com as units
    # atuais (icecast2-somdomato/liquidsoap-somdomato) — a que perdia a
    # corrida ficava em crash-loop permanente. Ver incidente 2026-08-13.
    - name: Parar e desabilitar units legadas (nomes antigos, pré-Ansible)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: [somdomato-icecast.service, somdomato-liquidsoap.service]
      failed_when: false
      tags: [systemd]

    - name: Remover unit files legados
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop: [somdomato-icecast.service, somdomato-liquidsoap.service]
      notify: Reload systemd
      tags: [systemd]

    - name: Gerar unit somdomato-api.service
      ansible.builtin.template:
        src: etc/systemd/system/somdomato-api.service
        dest: /etc/systemd/system/somdomato-api.service
        mode: "0644"
      notify: Reload systemd
      tags: [systemd]

    - name: Copiar units systemd restantes
      ansible.builtin.copy:
        src: "etc/systemd/system/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop: [icecast2-somdomato.service, liquidsoap-somdomato.service]
      notify: Reload systemd
      tags: [systemd]

    - name: Habilitar e iniciar serviços
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: [icecast2-somdomato.service, liquidsoap-somdomato.service]
      # somdomato-api.service só é iniciado depois que o primeiro binário
      # existir em {{ app_dir }}/bin — ver scripts/deploy.sh.
      tags: [systemd]

    # =========================================================================
    # DEPLOY (GitHub Actions) — sudo restrito para reiniciar a API
    # =========================================================================
    - name: Liberar sudo NOPASSWD para {{ deploy_user }} reiniciar somdomato-api
      ansible.builtin.template:
        src: etc/sudoers.d/somdomato-deploy.j2
        dest: /etc/sudoers.d/somdomato-deploy
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      tags: [deploy]

    # =========================================================================
    # SSL (Let's Encrypt)
    # =========================================================================
    - name: Instalar Certbot
      ansible.builtin.apt:
        name: [certbot, python3-certbot-nginx]
        state: present
      tags: [ssl]

    - name: Verificar se certificado existe
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
      register: ssl_cert
      tags: [ssl]

    - name: Obter certificado SSL (primeira vez)
      ansible.builtin.command: >
        certbot certonly --nginx
        -d {{ domain }} -d www.{{ domain }} -d radio.{{ domain }}
        --non-interactive --agree-tos --email {{ letsencrypt_email }}
      when: not ssl_cert.stat.exists
      changed_when: false
      tags: [ssl]

  handlers:
    - name: Reload Nginx
      ansible.builtin.systemd: { name: nginx, state: reloaded }

    - name: Restart Icecast
      ansible.builtin.systemd: { name: icecast2-somdomato, state: restarted }

    - name: Restart Liquidsoap
      ansible.builtin.systemd: { name: liquidsoap-somdomato, state: restarted }

    - name: Restart API Go
      ansible.builtin.systemd: { name: somdomato-api, state: restarted }

    - name: Reload systemd
      ansible.builtin.systemd: { daemon_reload: true }
