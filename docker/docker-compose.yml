services:
  nginx:
    image: nginx:alpine
    container_name: somdomato-nginx
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: ./nginx.dev.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    depends_on:
      - icecast
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - radio-network
    restart: unless-stopped

  icecast:
    image: moul/icecast
    container_name: somdomato-icecast
    ports:
      - "8000:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=hackme
      - ICECAST_ADMIN_PASSWORD=hackme
      - ICECAST_PASSWORD=hackme
      - ICECAST_RELAY_PASSWORD=hackme
      - ICECAST_HOSTNAME=localhost
    volumes:
      - type: bind
        source: ../files/etc/icecast/somdomato.xml
        target: /etc/icecast2/icecast.xml
        read_only: true
    restart: unless-stopped
    networks:
      - radio-network

  liquidsoap:
    build:
      context: .
      dockerfile: Dockerfile.liquidsoap
    container_name: somdomato-liquidsoap
    ports:
      - "8081:8081"  # Porta de controle Harbor HTTP
    depends_on:
      - icecast
    volumes:
      - type: bind
        source: ../files/etc/liquidsoap/somdomato-docker.liq
        target: /etc/liquidsoap/somdomato.liq
        read_only: true
      - type: bind
        source: /home/lucas/music/sdm
        target: /var/music/sdm
        read_only: true
    environment:
      - LIQUIDSOAP_LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - radio-network
    restart: unless-stopped

networks:
  radio-network:
    name: somdomato-radio-network
    driver: bridge
