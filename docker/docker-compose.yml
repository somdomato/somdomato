services:
  nginx:
    image: nginx:alpine
    container_name: somdomato-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - icecast
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - radio-network
    restart: unless-stopped

  icecast:
    image: moul/icecast
    container_name: somdomato-icecast
    ports:
      - "8000:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=hackme
      - ICECAST_ADMIN_PASSWORD=hackme
      - ICECAST_PASSWORD=hackme
      - ICECAST_RELAY_PASSWORD=hackme
      - ICECAST_HOSTNAME=localhost
    volumes:
      - ../files/etc/icecast/somdomato.xml:/etc/icecast2/icecast.xml:ro
    restart: unless-stopped
    networks:
      - radio-network

  liquidsoap:
    build:
      context: .
      dockerfile: Dockerfile.liquidsoap
    container_name: somdomato-liquidsoap
    ports:
      - "8081:8081"  # Porta de controle Harbor HTTP
    depends_on:
      - icecast
    volumes:
      - ../files/etc/liquidsoap/somdomato-docker.liq:/etc/liquidsoap/somdomato.liq:ro
      - /home/lucas/music/sdm:/var/music/sdm:ro
    environment:
      - LIQUIDSOAP_LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - radio-network
    restart: unless-stopped

networks:
  radio-network:
    driver: bridge
