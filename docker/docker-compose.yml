services:
  nextjs:
    container_name: somdomato-nextjs
    build:
      context: ..
      dockerfile: docker/Dockerfile.nextjs
    env_file:
      - ../.env
    volumes:
      - type: bind
        source: ..
        target: /app
      - node_modules:/app/node_modules
      - nextjs_cache:/app/.next
      - type: bind
        source: ${MUSIC_PATH:-/home/lucas/music/sdm}
        target: /var/music/sdm
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - MUSIC_PATH=/var/music/sdm
      - UPLOADS_DIR=/var/music/sdm/uploads
    networks:
      - radio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/songs/last?genre=geral"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    container_name: somdomato-nginx
    image: nginx:alpine
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - type: bind
        source: ./nginx.dev.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./certs
        target: /etc/nginx/certs
        read_only: true
    depends_on:
      nextjs:
        condition: service_healthy
      icecast:
        condition: service_started
    networks:
      - radio-network
    restart: unless-stopped

  icecast:
    container_name: somdomato-icecast
    image: moul/icecast
    ports:
      - "8000:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=hackme
      - ICECAST_ADMIN_PASSWORD=hackme
      - ICECAST_PASSWORD=hackme
      - ICECAST_RELAY_PASSWORD=hackme
      - ICECAST_HOSTNAME=localhost
    volumes:
      - type: bind
        source: ../ansible/etc/icecast/somdomato-docker.xml
        target: /etc/icecast2/icecast.xml
        read_only: true
    restart: unless-stopped
    networks:
      - radio-network

  liquidsoap:
    container_name: somdomato-liquidsoap
    build:
      context: .
      dockerfile: Dockerfile.liquidsoap
    ports:
      - "8081:8081"
    depends_on:
      icecast:
        condition: service_started
      nextjs:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../ansible/etc/liquidsoap/somdomato-docker.liq
        target: /etc/liquidsoap/somdomato.liq
        read_only: true
      - type: bind
        source: ${MUSIC_PATH:-/home/lucas/music/sdm}
        target: /var/music/sdm
        read_only: true
    environment:
      - LIQUIDSOAP_LOG_LEVEL=info
    networks:
      - radio-network
    restart: unless-stopped

volumes:
  node_modules:
  nextjs_cache:

networks:
  radio-network:
    name: somdomato-radio-network
    driver: bridge
