# Proxy reverso para Icecast
# Este arquivo configura o subdomínio radio.somdomato.com para servir o stream de áudio

server {
    listen 80;
    listen [::]:80;
    server_name radio.somdomato.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;
   
    ssl_certificate         /etc/letsencrypt/live/somdomato.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/somdomato.com/privkey.pem;

    server_name radio.somdomato.com;

    # Aumentar buffer size para streaming de áudio
    proxy_buffering off;
    proxy_buffer_size 4k;

    # CORS headers para permitir acesso cross-origin
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Range, Content-Type' always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    location / {
        # Proxy reverso para Icecast
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        
        # Headers para manter informação do cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers para streaming
        proxy_set_header Connection '';
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts para streaming contínuo
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Logging
    access_log /var/log/nginx/radio.somdomato.com.access.log;
    error_log /var/log/nginx/radio.somdomato.com.error.log;
}
