name: somdomato

services:
  postgres:
    container_name: somdomato-postgres
    image: docker.io/library/postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sdm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sdm_dev_only}
      - POSTGRES_DB=${POSTGRES_DB:-sdm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - radio-network
    restart: unless-stopped

  icecast:
    container_name: somdomato-icecast
    build:
      context: .
      dockerfile: Containerfile.icecast
    volumes:
      - type: bind
        source: ../ansible/etc/icecast/somdomato-podman.xml
        target: /etc/icecast2/icecast.xml
        read_only: true
    ports:
      - "8000:8000"
    networks:
      - radio-network
    restart: unless-stopped

  liquidsoap:
    container_name: somdomato-liquidsoap
    build:
      context: .
      dockerfile: Containerfile.liquidsoap
    volumes:
      - type: bind
        source: ../ansible/etc/liquidsoap/somdomato-podman.liq
        target: /etc/liquidsoap/somdomato.liq
        read_only: true
      - type: bind
        # Monta no MESMO caminho absoluto do host (não em /var/music/sdm):
        # a API roda nativa e grava `songs.path`/`jingles.path` com o
        # caminho do host — o Liquidsoap abre esse `path` literalmente (ver
        # somdomato-podman.liq), então os dois precisam enxergar o arquivo
        # no mesmo lugar.
        source: ${MUSIC_PATH:-/home/lucas/music/sdm}
        target: ${MUSIC_PATH:-/home/lucas/music/sdm}
        read_only: true
    environment:
      - RADIO_INTERNAL_TOKEN=${RADIO_INTERNAL_TOKEN:-dev-change-me-too}
    extra_hosts:
      # a API roda nativa no host (via `make air`), não em container — o
      # liquidsoap acessa http://host.containers.internal:3001 (ver
      # ansible/etc/liquidsoap/somdomato-podman.liq).
      - "host.containers.internal:host-gateway"
    ports:
      - "8081:8081"
    depends_on:
      icecast:
        condition: service_started
    networks:
      - radio-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  radio-network:
    name: somdomato-radio-network
    driver: bridge
