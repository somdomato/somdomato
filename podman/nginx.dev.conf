# Podman's internal DNS resolver (aardvark-dns via netavark) — defers upstream
# resolution to request time (upstream{} blocks resolve at startup and fail
# in Podman). Note: this address is netavark's default; if your Podman setup
# uses a different network backend, check `podman network inspect <net>`.
resolver 169.254.1.1 valid=10s ipv6=off;
resolver_timeout 5s;

# HTTP → HTTPS (mirrors both somdomato.com.conf and radio.somdomato.com.conf)
server {
    listen 80;
    server_name localhost radio.localhost;
    return 301 https://$host$request_uri;
}

# ── Main app — mirrors somdomato.com.conf ────────────────────────────────────

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 5m;

    # Upstream addresses as variables — resolved at request time via resolver above
    set $nextjs  "nextjs:3000";

    # ── deny.conf ────────────────────────────────────────────────────────────
    location ~ /\.        { deny all; }
    location ~ ~$         { deny all; }
    location ~ \.php$     { deny all; }

    # ── sdm-errors.conf ──────────────────────────────────────────────────────
    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414
               415 416 417 418 421 422 423 424 425 426 428 429 431 451
               500 501 502 503 504 505 506 507 508 510 511 /error.html;
    location = /error.html {
        ssi on;
        internal;
        auth_basic off;
        root /app/errors;
    }

    # Bloqueia acesso externo às rotas internas do Liquidsoap
    location /api/music {
        deny all;
        return 403;
    }

    # ── Icecast stream proxy (dev only) ─────────────────────────────────────
    set $icecast "icecast:8000";

    location /radio/ {
        rewrite ^/radio/(.*) /$1 break;

        proxy_buffering off;
        proxy_buffer_size 4k;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;

        proxy_pass http://$icecast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # ── Static assets served directly (mirrors somdomato.com.conf) ───────────
    # try_files faz fallback para Next.js quando o arquivo ainda não existe em disco (dev)
    location /_next/static {
        alias /app/.next/static;
        add_header Cache-Control "public, max-age=3600, immutable";
        try_files $uri @nextjs_proxy;
    }

    # ── cache.conf ───────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|webp|webm|css|mp3|mp4|wav|swf|mov|pdf)$ {
        add_header Access-Control-Allow-Origin *;
        expires 90d;
        proxy_pass http://$nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.io WebSocket upgrade ──────────────────────────────────────────
    location /socket.io/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, POST, OPTIONS';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Content-Type, Authorization' always;

        proxy_pass http://$nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # ── Next.js application ──────────────────────────────────────────────────
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, POST, OPTIONS';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Content-Type, Authorization' always;

        proxy_pass http://$nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location @nextjs_proxy {
        proxy_pass http://$nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Radio/Icecast — mirrors radio.somdomato.com.conf ─────────────────────────

server {
    listen 443 ssl;
    http2 on;
    server_name radio.localhost;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 5m;

    set $icecast "icecast:8000";

    proxy_buffering off;
    proxy_buffer_size 4k;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Content-Type' always;

        proxy_pass http://$icecast;
        proxy_http_version 1.1;
        proxy_redirect http://$icecast/ https://$host/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection '';
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/radio.localhost.access.log;
    error_log  /var/log/nginx/radio.localhost.error.log;
}
